<title>WyBuild</title>
<script>
// Kill legacy Flutter PWA workers/caches before the new Flutter bootstrap runs.
// A one-time reload is used because an already-controlled document can remain
// attached to an old service worker until navigation; sessionStorage prevents a
// reload loop. The current build also uses --pwa-strategy=none.
(function () {
  if (!('serviceWorker' in navigator)) return;
  var key = '__wybuild_sw_cleanup_v21__';
  if (sessionStorage.getItem(key)) return;
  sessionStorage.setItem(key, '1');
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.map(function (r) { return r.unregister(); }));
  }).then(function () {
    if (!('caches' in window)) return;
    return caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    });
  }).then(function () {
    location.reload();
  }).catch(function () {});
})();
</script>
</head><body><script src="flutter_bootstrap.js" async></script></body></html>
