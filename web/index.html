<script>
// Prevent an older Flutter PWA service worker/cache from pinning the app to a previous deployment.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) { return r.unregister(); }));
    }).then(function () {
      if ('caches' in window) return caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); });
    }).catch(function () {});
  });
}
</script>
