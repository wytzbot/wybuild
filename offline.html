<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e11" />
<title>Offline — WyDev</title>
<style>
  :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0e11; color: #f5f7fa; display: grid; place-items: center; padding: 24px; }
  main { width: min(100%, 440px); text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 22px; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,.04); }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #8b95a7; }
  h1 { margin: 8px 0 12px; font-size: clamp(30px, 8vw, 42px); letter-spacing: -.04em; }
  p { margin: 0 auto 22px; max-width: 380px; color: #9da7b5; line-height: 1.65; }
  button { appearance: none; border: 0; border-radius: 12px; padding: 13px 20px; font: inherit; font-weight: 750; color: #0b0e11; background: #f5f7fa; cursor: pointer; }
  button:active { transform: scale(.98); }
  .hint { margin-top: 18px; font-size: 12px; color: #697383; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">↯</div>
  <span class="eyebrow">CONNECTION LOST</span>
  <h1>You're offline</h1>
  <p>WyDev needs an internet connection for GitHub, syncing, billing and other cloud actions. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
  <p class="hint">Your local WyDev data is kept on this device.</p>
</main>
</body>
</html>
