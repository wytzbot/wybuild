# wybuild-workflow-version: 6
name: WyBuild
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build target
        required: true
        type: choice
        options:
          - auto
          - apk
          - aab
          - web
        default: auto
      build_mode:
        description: Build mode
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

# Bakes the requested target into GitHub's run display_title so the frontend
# can tell, from the runs list alone, whether a run was an apk/aab/web/auto
# build - no extra API call needed just to label the download button.
run-name: "WyBuild: ${{ inputs.build_type }} (${{ inputs.build_mode }}) on ${{ github.ref_name }}"

permissions:
  contents: read

concurrency:
  group: wybuild-${{ github.repository }}-${{ github.ref }}-${{ inputs.build_type }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            type=flutter
          elif find . -type f -name gradlew -not -path './.git/*' -not -path '*/node_modules/*' | grep -q .; then
            type=gradle
          elif [ -f package.json ]; then
            if node -e "const p=require('./package.json'); process.exit(p.dependencies?.next || p.devDependencies?.next ? 0 : 1)"; then
              type=next
            else
              type=node-web
            fi
          elif find . -maxdepth 3 -type f \( -name 'index.html' -o -name '*.html' \) -not -path './.git/*' | grep -q .; then
            type=vanilla
          else
            type=unknown
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $type"

      - name: Validate requested target
        shell: bash
        env:
          REQUESTED: ${{ inputs.build_type }}
          DETECTED: ${{ steps.detect.outputs.type }}
        run: |
          set -euo pipefail
          if [ "$DETECTED" = "unknown" ]; then
            echo "::error title=Unsupported project::WyBuild could not detect a supported project."
            exit 1
          fi
          if [ "$REQUESTED" = "aab" ]; then
            if [ "$DETECTED" != "flutter" ] && [ "$DETECTED" != "gradle" ]; then
              echo "::error title=AAB unavailable::AAB builds require a Flutter or Android/Gradle project. Detected: $DETECTED"
              exit 1
            fi
          fi
          if [ "$REQUESTED" = "apk" ]; then
            if [ "$DETECTED" != "flutter" ] && [ "$DETECTED" != "gradle" ] && [ "$DETECTED" != "node-web" ] && [ "$DETECTED" != "vanilla" ]; then
              echo "::error title=APK target unavailable::APK builds support Flutter, Android/Gradle, Vite/React/Node web and vanilla HTML. Next.js needs a static export or an existing Android wrapper."
              exit 1
            fi
          fi
          if [ "$REQUESTED" = "web" ]; then
            if [ "$DETECTED" = "flutter" ] || [ "$DETECTED" = "gradle" ]; then
              echo "::error title=Web target unavailable::Web builds require a web project."
              exit 1
            fi
          fi

      - name: Set up Java
        if: steps.detect.outputs.type == 'flutter' || steps.detect.outputs.type == 'gradle' || (inputs.build_type == 'apk' && (steps.detect.outputs.type == 'node-web' || steps.detect.outputs.type == 'vanilla'))
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Build Flutter Android
        if: steps.detect.outputs.type == 'flutter' && (inputs.build_type == 'apk' || inputs.build_type == 'aab' || inputs.build_type == 'auto')
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if [ "${{ inputs.build_type }}" = "aab" ]; then
            flutter build appbundle --release
          elif [ "${{ inputs.build_type }}" = "apk" ]; then
            if [ "${{ inputs.build_mode }}" = "debug" ]; then flutter build apk --debug; else flutter build apk --release; fi
          else
            flutter build apk --release
          fi

      - name: Build existing Gradle Android project
        if: steps.detect.outputs.type == 'gradle' && (inputs.build_type == 'apk' || inputs.build_type == 'aab' || inputs.build_type == 'auto')
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(find . -type f -name gradlew -not -path './.git/*' -not -path '*/node_modules/*' | head -n 1)"
          project_dir="$(dirname "$wrapper")"
          cd "$project_dir"
          chmod +x ./gradlew
          ./gradlew --version
          if [ "${{ inputs.build_type }}" = "aab" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          elif [ "${{ inputs.build_type }}" = "apk" ]; then
            if [ "${{ inputs.build_mode }}" = "debug" ]; then ./gradlew assembleDebug --no-daemon --stacktrace; else ./gradlew assembleRelease --no-daemon --stacktrace; fi
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.type == 'next' || steps.detect.outputs.type == 'node-web'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Node dependencies
        if: steps.detect.outputs.type == 'next' || steps.detect.outputs.type == 'node-web'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          else npm install
          fi

      - name: Build static web output
        id: webbuild
        if: (steps.detect.outputs.type == 'node-web' || steps.detect.outputs.type == 'vanilla') && (inputs.build_type == 'web' || inputs.build_type == 'apk' || inputs.build_type == 'auto')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wybuild-output
          if [ "${{ steps.detect.outputs.type }}" = "node-web" ]; then
            if node -e "const p=require('./package.json'); process.exit(typeof p.scripts?.build === 'string' ? 0 : 1)"; then
              npm run build
            fi
          fi
          if [ -d dist ]; then cp -R dist/. wybuild-output/
          elif [ -d build ]; then cp -R build/. wybuild-output/
          elif [ -f index.html ]; then
            rsync -a --exclude node_modules --exclude .git --exclude wybuild-output ./ wybuild-output/
          else
            echo "::error title=No static output::Could not find dist, build or index.html."
            exit 1
          fi
          test -f wybuild-output/index.html || {
            echo "::error title=Not a static web app::The project did not produce an index.html. For Next.js use static export or an existing Android wrapper."
            exit 1
          }

      - name: Build Web → Android APK wrapper
        if: inputs.build_type == 'apk' && (steps.detect.outputs.type == 'node-web' || steps.detect.outputs.type == 'vanilla')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wybuild-wrapper/app/src/main/java/com/wybuild/wrapper
          mkdir -p wybuild-wrapper/app/src/main/assets/www
          cp -R wybuild-output/. wybuild-wrapper/app/src/main/assets/www/

          cat > wybuild-wrapper/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "WyBuildWebWrapper"
          include(":app")
          EOF

          cat > wybuild-wrapper/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > wybuild-wrapper/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.wybuild.wrapper'; compileSdk 35
            defaultConfig { applicationId 'com.wybuild.wrapper'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          EOF

          cat > wybuild-wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="WyBuild App" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p wybuild-wrapper/app/src/main/res/values
          cat > wybuild-wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#4F46E5</item></style></resources>
          EOF

          cat > wybuild-wrapper/app/src/main/java/com/wybuild/wrapper/MainActivity.java <<'EOF'
          package com.wybuild.wrapper;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              WebView web = new WebView(this);
              web.setWebViewClient(new WebViewClient());
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              web.loadUrl("file:///android_asset/www/index.html");
              setContentView(web);
            }
          }
          EOF

          cd wybuild-wrapper
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.11.1
          else
            echo "::error title=Gradle unavailable::The GitHub runner did not provide Gradle."
            exit 1
          fi
          chmod +x gradlew
          if [ "${{ inputs.build_mode }}" = "debug" ]; then ./gradlew assembleDebug --no-daemon --stacktrace; else ./gradlew assembleRelease --no-daemon --stacktrace; fi

      - name: Build Next.js web package
        if: steps.detect.outputs.type == 'next' && (inputs.build_type == 'web' || inputs.build_type == 'auto')
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          mkdir -p wybuild-output
          tar -czf wybuild-output/next-build.tar.gz .next public package.json 2>/dev/null || tar -czf wybuild-output/next-build.tar.gz .next package.json

      - name: Package web output
        if: inputs.build_type == 'web' || inputs.build_type == 'auto'
        uses: actions/upload-artifact@v6
        with:
          name: wybuild-web-${{ github.run_number }}
          path: 'wybuild-output/*'
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK
        if: inputs.build_type == 'apk' || inputs.build_type == 'auto'
        uses: actions/upload-artifact@v6
        with:
          name: wybuild-apk-${{ github.run_number }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        if: inputs.build_type == 'aab'
        uses: actions/upload-artifact@v6
        with:
          name: wybuild-aab-${{ github.run_number }}
          path: '**/build/outputs/bundle/**/*.aab'
          if-no-files-found: error
          retention-days: 7
